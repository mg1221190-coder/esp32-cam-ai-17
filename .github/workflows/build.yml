name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP-IDF Binaries
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Git Permissions
        run: git config --global --add safe.directory '*'

      - name: Unpack Zip and Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh

          # 1. Unzip any uploaded project archive
          python3 -c "
          import zipfile, glob
          zips = glob.glob('*.zip') + glob.glob('**/*.zip', recursive=True)
          for z in zips:
              print('Unpacking:', z)
              with zipfile.ZipFile(z, 'r') as zip_ref:
                  zip_ref.extractall('extracted_project')
          "

          # 2. Add compatibility macro for Bluetooth on ESP-IDF v5.1
          python3 -c "
          import glob, re
          for path in glob.glob('**/*.cpp', recursive=True) + glob.glob('**/*.c', recursive=True):
              with open(path, 'r', errors='ignore') as f:
                  code = f.read()
              if 'esp_hf_ag_register_audio_data_callback' in code:
                  print('Applying Bluetooth v5.1 macro to:', path)
                  macro = '\n#ifndef esp_hf_ag_register_audio_data_callback\n#define esp_hf_ag_register_audio_data_callback(cb) esp_hf_ag_register_data_callback((esp_hf_incoming_data_cb_t)(cb), NULL)\n#endif\n'
                  if '#include \"esp_hf_ag_api.h\"' in code:
                      code = code.replace('#include \"esp_hf_ag_api.h\"', '#include \"esp_hf_ag_api.h\"' + macro)
                  else:
                      includes = list(re.finditer(r'#include[^\n]+', code))
                      if includes:
                          pos = includes[-1].end()
                          code = code[:pos] + macro + code[pos:]
                  with open(path, 'w') as f:
                      f.write(code)
          "

          # 3. Locate the project directory
          PROJECT_DIR=""
          for f in $(find . -name "CMakeLists.txt"); do
            dir=$(dirname "$f")
            if [ -d "$dir/main" ] && [ -f "$dir/main/CMakeLists.txt" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project directory not found."
            exit 1
          fi

          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          idf.py set-target esp32

          # 4. Compile and catch any errors cleanly
          if ! idf.py build; then
            echo "=================================================="
            echo "             BUILD FAILED ERROR DETAILS           "
            echo "=================================================="
            cat build/log/idf_py_stderr_output_* 2>/dev/null || true
            exit 1
          fi

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-binaries
          path: |
            **/build/bootloader/bootloader.bin
            **/build/partition_table/partition-table.bin
            **/build/*.bin
